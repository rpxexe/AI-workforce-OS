[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workforce-sdk"
version = "0.1.0"
description = "Python SDK for the AI Workforce public API: client, paging, retries, streaming replies and webhook verification."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["workforce_sdk"]
